<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Portfolio Mery</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: "Poppins", sans-serif;
            background: #ffffff;
            color: #10182f;
            line-height: 1.6;
            overflow-x: hidden;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        img {
            display: block;
            max-width: 100%;
        }

        .container {
            width: 90%;
            max-width: 1150px;
            margin: auto;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 999;

            background: rgba(255,255,255,.92);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid #e5eaf3;
        }

        .nav-container {
            height: 75px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            color: #10182f;
        }

        .logo span {
            color: #2563eb;
        }

        .nav-menu {
            display: flex;
            gap: 30px;
        }

        .nav-menu a {
            color: #667085;
            font-size: 13px;
            font-weight: 500;

            transition: .3s;
        }

        .nav-menu a:hover {
            color: #2563eb;
        }

        .nav-button {
            background: #2563eb;
            color: white;

            padding: 11px 19px;

            border-radius: 9px;

            font-size: 13px;
            font-weight: 600;

            transition: .3s;
        }

        .nav-button:hover {
            background: #174fc5;
            transform: translateY(-2px);
        }


        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: 100vh;
            padding-top: 100px;

            background:
                radial-gradient(
                    circle at 80% 30%,
                    #dbeafe,
                    transparent 35%
                ),
                linear-gradient(
                    135deg,
                    #ffffff,
                    #f4f8ff
                );

            display: flex;
            align-items: center;
        }

        .hero-container {
            display: grid;

            grid-template-columns: 1fr 1fr;

            align-items: center;

            gap: 60px;
        }

        .hello {
            color: #2563eb;

            font-size: 16px;
            font-weight: 600;

            margin-bottom: 8px;
        }

        .hero-text h1 {
            font-size: clamp(55px, 8vw, 85px);

            line-height: 1;

            font-weight: 800;

            letter-spacing: -4px;

            color: #10182f;
        }

        .hero-text h2 {
            font-size: clamp(25px, 4vw, 40px);

            margin-top: 12px;

            line-height: 1.2;
        }

        .hero-text h2 span {
            color: #2563eb;
        }

        .hero-description {
            max-width: 560px;

            margin-top: 20px;

            color: #667085;

            font-size: 14px;
        }

        .hero-buttons {
            display: flex;

            gap: 12px;

            margin-top: 30px;
        }

        .btn {
            padding: 13px 22px;

            border-radius: 9px;

            font-size: 13px;

            font-weight: 600;

            transition: .3s;
        }

        .btn-primary {
            background: #2563eb;
            color: white;

            box-shadow:
                0 10px 25px rgba(37,99,235,.20);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            background: #174fc5;
        }

        .btn-outline {
            border: 1px solid #2563eb;
            color: #2563eb;
            background: white;
        }

        .btn-outline:hover {
            background: #2563eb;
            color: white;
        }

        .social-links {
            display: flex;

            gap: 25px;

            margin-top: 28px;
        }

        .social-links a {
            color: #667085;

            font-size: 12px;

            transition: .3s;
        }

        .social-links a:hover {
            color: #2563eb;
        }


        /* =========================
           FOTO
        ========================= */

        .hero-image {
            position: relative;

            min-height: 520px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-ring {
            width: 370px;
            height: 370px;

            padding: 10px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #60a5fa
                );

            box-shadow:
                0 30px 70px rgba(37,99,235,.20);

            position: relative;

            z-index: 2;
        }

        .photo-ring img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border: 7px solid white;
        }

        .circle-decoration {
            position: absolute;

            width: 440px;
            height: 440px;

            border-radius: 50%;

            border: 2px dashed #bcd3ff;

            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .learning-box {
            position: absolute;

            bottom: 45px;
            left: 20px;

            z-index: 5;

            display: flex;
            align-items: center;

            gap: 12px;

            padding: 15px 20px;

            background: white;

            border-radius: 16px;

            box-shadow:
                0 15px 40px rgba(0,0,0,.10);
        }

        .learning-box span {
            font-size: 25px;
        }

        .learning-box p {
            color: #667085;

            font-size: 11px;

            font-weight: 600;
        }


        /* =========================
           INFO
        ========================= */

        .profile-info {
            padding: 55px 0;

            background: #10182f;

            color: white;
        }

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            text-align: center;

            gap: 20px;
        }

        .info-item strong {
            display: block;

            font-size: 22px;

            margin-bottom: 5px;
        }

        .info-item span {
            color: #9ba5bd;

            font-size: 12px;
        }


        /* =========================
           ABOUT
        ========================= */

        .about {
            padding: 110px 0;
        }

        .section-title {
            text-align: center;

            margin-bottom: 55px;
        }

        .section-title span {
            color: #2563eb;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;
        }

        .section-title h2 {
            font-size: clamp(38px,6vw,55px);

            margin-top: 8px;
        }

        .section-title h2 b {
            color: #2563eb;
        }

        .about-content {
            max-width: 800px;

            margin: auto;

            text-align: center;
        }

        .about-content p {
            color: #667085;

            font-size: 14px;

            line-height: 1.9;
        }


        /* =========================
           SKILLS
        ========================= */

        .skills {
            padding: 110px 0;

            background: #090914;

            color: white;
        }

        .skills .section-title h2 {
            color: white;
        }

        .skills .section-title p {
            color: #ff5db1;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 3px;
        }

        .skills .section-title b {
            background:
                linear-gradient(
                    90deg,
                    #ff5db1,
                    #9b6cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .skills-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 25px;
        }

        .skill-card {
            padding: 35px;

            min-height: 290px;

            background: #151522;

            border: 1px solid rgba(255,255,255,.10);

            border-radius: 25px;

            transition: .35s;

            position: relative;

            overflow: hidden;
        }

        .skill-card:hover {
            transform: translateY(-7px);

            border-color:
                rgba(255,93,177,.40);

            box-shadow:
                0 25px 60px rgba(0,0,0,.35);
        }

        .skill-top {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 50px;
        }

        .skill-icon {
            width: 90px;
            height: 90px;

            border-radius: 24px;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;

            font-weight: 800;
        }

        .html {
            color: #ff806d;
            background: rgba(255,100,80,.15);
        }

        .css {
            color: #6da8ff;
            background: rgba(70,120,255,.15);
        }

        .js {
            color: #ffd84d;
            background: rgba(255,216,77,.13);
        }

        .git {
            color: #c9b6ff;
            background: rgba(155,108,255,.15);
        }

        .skill-percent {
            font-size: 28px;

            background:
                linear-gradient(
                    90deg,
                    #ff5db1,
                    #9b6cff
                );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .skill-card h3 {
            font-size: 24px;

            margin-bottom: 10px;
        }

        .skill-card p {
            color: #9696aa;

            font-size: 13px;

            line-height: 1.8;
        }

        .progress {
            height: 8px;

            background: #29293a;

            border-radius: 20px;

            overflow: hidden;

            margin-top: 25px;
        }

        .progress span {
            display: block;

            height: 100%;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #ff5db1,
                    #9b6cff
                );
        }


        /* =========================
           PROJECTS
        ========================= */

        .projects {
            padding: 110px 0;

            background: #f7f9fc;
        }

        .project-grid {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 22px;
        }

        .project-card {
            background: white;

            border: 1px solid #e5eaf3;

            border-radius: 20px;

            overflow: hidden;

            transition: .3s;
        }

        .project-card:hover {
            transform: translateY(-7px);

            box-shadow:
                0 20px 45px rgba(15,23,42,.10);
        }

        .project-cover {
            height: 190px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #2563eb,
                    #60a5fa
                );
        }

        .project-cover span {
            font-size: 11px;

            letter-spacing: 3px;

            opacity: .8;
        }

        .project-cover h3 {
            font-size: 28px;

            margin-top: 7px;
        }

        .project-content {
            padding: 25px;
        }

        .project-content h3 {
            font-size: 19px;

            margin-bottom: 8px;
        }

        .project-content p {
            color: #667085;

            font-size: 12px;

            line-height: 1.8;
        }

        .tags {
            display: flex;

            gap: 7px;

            flex-wrap: wrap;

            margin-top: 18px;
        }

        .tags span {
            padding: 6px 10px;

            border-radius: 6px;

            color: #2563eb;

            background: #eff6ff;

            font-size: 9px;

            font-weight: 700;
        }

        .project-link {
            display: inline-block;

            margin-top: 20px;

            color: #2563eb;

            font-size: 12px;

            font-weight: 700;
        }


        /* =========================
           CONTACT
        ========================= */

        .contact {
            padding: 110px 0;

            background: white;
        }

        .contact-box {
            max-width: 800px;

            margin: auto;

            padding: 60px 30px;

            text-align: center;

            background: #f5f8ff;

            border-radius: 25px;

            border: 1px solid #dbe7ff;
        }

        .contact-box h2 {
            font-size: 38px;
        }

        .contact-box p {
            color: #667085;

            font-size: 13px;

            margin-top: 12px;
        }

        .contact-button {
            display: inline-block;

            margin-top: 25px;

            padding: 13px 25px;

            border-radius: 9px;

            background: #2563eb;

            color: white;

            font-size: 13px;

            font-weight: 600;
        }


        /* =========================
           FOOTER
        ========================= */

        footer {
            padding: 25px;

            text-align: center;

            background: #10182f;

            color: #9ba5bd;

            font-size: 11px;
        }


        /* =========================
           RESPONSIVE HP
        ========================= */

        @media (max-width: 800px) {

            .nav-menu {
                display: none;
            }

            .nav-button {
                display: none;
            }

            .hero {
                padding-top: 100px;

                padding-bottom: 50px;
            }

            .hero-container {
                grid-template-columns: 1fr;

                text-align: center;

                gap: 20px;
            }

            .hero-text {
                order: 2;
            }

            .hero-image {
                order: 1;

                min-height: 390px;
            }

            .hero-description {
                margin-left: auto;
                margin-right: auto;
            }

            .hero-buttons {
                justify-content: center;

                flex-direction: column;
            }

            .social-links {
                justify-content: center;
            }

            .photo-ring {
                width: 290px;
                height: 290px;
            }

            .circle-decoration {
                width: 350px;
                height: 350px;
            }

            .learning-box {
                left: 10px;

                bottom: 15px;
            }

            .info-grid {
                grid-template-columns: 1fr;
            }

            .skills-grid {
                grid-template-columns: 1fr;
            }

            .project-grid {
                grid-template-columns: 1fr;
            }

            .skill-card {
                padding: 28px;
            }

            .skill-top {
                margin-bottom: 40px;
            }
        }

    </style>
</head>

    ========================= -->

    <section class="profile-info">

        <div class="container info
